name: Backend CI/CD

on:
  push:
    branches: [ master, main, ci-cd-setup ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run linter (if available)
      run: npm run lint --if-present
      continue-on-error: true

    - name: Run tests
      run: npm test
      env:
        NODE_ENV: test

    - name: Check build
      run: npm run build --if-present

  performance-tests:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install k6
      run: |
        sudo gpg -k
        sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
        echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
        sudo apt-get update
        sudo apt-get install k6

    - name: Start backend server
      run: |
        npm start &
        sleep 5
        curl --retry 10 --retry-delay 2 --retry-connrefused http://localhost:5000/health
      env:
        NODE_ENV: test
        PORT: 5000

    - name: Run Load Test - Courses
      run: k6 run performance/courses-load-test.js
      env:
        API_URL: http://localhost:5000

    - name: Run Spike Test - Courses
      run: k6 run performance/courses-spike-test.js
      env:
        API_URL: http://localhost:5000

  deploy:
    needs: [build-and-test, performance-tests]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to Render
      env:
        RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      run: |
        if [ -n "$RENDER_DEPLOY_HOOK" ]; then
          curl -X POST "$RENDER_DEPLOY_HOOK"
          echo "Deployment triggered successfully"
        else
          echo "RENDER_DEPLOY_HOOK not set. Skipping deployment."
        fi
