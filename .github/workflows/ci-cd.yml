name: Backend CI/CD

on:
  push:
    branches: [ master, main, ci-cd-setup, adreas_load_spike_tests ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linter (if available)
        run: npm run lint --if-present
        continue-on-error: true

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test

      - name: Check build
        run: npm run build --if-present

  perf-tests:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start backend (background)
        env:
          NODE_ENV: test
          PORT: 5000
        run: |
          nohup npm start > server.log 2>&1 &
          echo "Server started with PID $!"

      - name: Wait for backend to be ready (/users)
        run: |
          for i in {1..60}; do
            if curl -sf http://localhost:5000/users >/dev/null; then
              echo "Backend is up!"
              exit 0
            fi
            echo "Waiting for backend... (attempt $i/60)"
            sleep 2
          done
          echo "Backend did not start in time"
          echo "---- server.log (last 200 lines) ----"
          tail -n 200 server.log || true
          exit 1

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run k6 load test (/users/:userId)
        env:
          API_URL: http://localhost:5000
        run: k6 run performance/users-load-test.js

      - name: Run k6 spike test (/users/:userId)
        env:
          API_URL: http://localhost:5000
        run: k6 run performance/users-spike-test.js
        
      - name: Run k6 load test (/courses)
        env:
          API_URL: http://localhost:5000
        run: k6 run performance/courses-load-test.js

      - name: Run k6 spike test (/courses)
        env:
          API_URL: http://localhost:5000
        run: k6 run performance/courses-spike-test.js

  deploy:
    needs: [build-and-test, perf-tests]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            curl -X POST "$RENDER_DEPLOY_HOOK"
            echo "Deployment triggered successfully"
          else
            echo "RENDER_DEPLOY_HOOK not set. Skipping deployment."
          fi
